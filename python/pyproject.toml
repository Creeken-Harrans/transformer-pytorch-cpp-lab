[project]
name = "transformer-lab"
version = "0.1.0"
description = "从数学原语学习完整 encoder-decoder Transformer，并与 C++ 实现互验"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["torch==2.8.0", "numpy==2.3.2"]

[project.scripts]
transformer-lab = "transformer_lab.cli:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/transformer_lab"]

[dependency-groups]
dev = ["pytest==8.4.1", "ruff==0.12.9"]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 92

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
